name: CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  test:
    name: TypeScript checks and unit tests
    runs-on:
      - self-hosted
      - linux
      - x64
      - makefile-convention-guard

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript check
        run: npm run check

      - name: Compile extension
        run: npm run compile

      - name: Run unit tests
        run: npm run test:unit
